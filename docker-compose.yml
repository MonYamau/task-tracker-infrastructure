services:
  postgres:
    image: postgres:18
    container_name: task-tracker-postgres
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5432:5432"
    volumes:
      - postgres_volume:/var/lib/postgresql

    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}" ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  kafka:
    image: apache/kafka:4.3.1
    container_name: task-tracker-kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs

    ports:
      - "29092:29092"

    volumes:
      - kafka_volume:/tmp/kraft-combined-logs

  backend:
    image: task-tracker-backend:local
    container_name: task-tracker-backend
    restart: unless-stopped

    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started

    ports:
      - "8080:8080"

    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: ${DB_URL}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      KAFKA_SERVER: ${KAFKA_SERVER}
      JWT_SECRET: ${JWT_SECRET}
      JWT_TTL_MINUTES: ${JWT_TTL_MINUTES}
      INTERNAL_TOKEN: ${INTERNAL_TOKEN}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}

  email-sender:
    image: task-tracker-email-sender:local
    container_name: task-tracker-email-sender
    restart: unless-stopped

    depends_on:
      kafka:
        condition: service_started

    environment:
      SPRING_PROFILES_ACTIVE: prod
      MAIL_HOST: ${MAIL_HOST}
      MAIL_PORT: ${MAIL_PORT}
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      MAIL_SENDER: ${MAIL_SENDER}
      KAFKA_SERVER: ${KAFKA_SERVER}

  summarization-service:
    image: task-tracker-summarization-service:local
    container_name: task-tracker-summarization-service
    restart: unless-stopped

    depends_on:
      kafka:
        condition: service_started

    environment:
      SPRING_PROFILES_ACTIVE: prod
      API_KEY: ${API_KEY}
      FOLDER_ID: ${FOLDER_ID}
      LLM_MODEL: ${LLM_MODEL}
      KAFKA_SERVER: ${KAFKA_SERVER}

  scheduler:
    image: task-tracker-scheduler:local
    container_name: task-tracker-scheduler
    restart: unless-stopped

    depends_on:
      kafka:
        condition: service_started

    environment:
      SPRING_PROFILES_ACTIVE: prod
      INTERNAL_TOKEN: ${INTERNAL_TOKEN}
      INTERNAL_URL: ${INTERNAL_URL}
      KAFKA_SERVER: ${KAFKA_SERVER}

  frontend:
    image: task-tracker-frontend:local
    container_name: task-tracker-frontend
    restart: unless-stopped

    depends_on:
      backend:
        condition: service_started

    ports:
      - "80:80"

volumes:
  postgres_volume:
  kafka_volume: