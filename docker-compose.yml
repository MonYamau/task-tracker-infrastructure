services:
  postgres:
    image: postgres:latest
    container_name: task_tracker_postgres
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5432:5432"
    volumes:
      - postgres_volume:/var/lib/postgresql

volumes:
  postgres_volume: